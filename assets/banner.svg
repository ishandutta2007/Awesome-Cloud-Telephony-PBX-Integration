<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <style>
      .orb-pulse {
        animation: pulseAnimation 6s ease-in-out infinite alternate;
      }
      .signal-line {
        stroke-dasharray: 8 6;
        animation: dashAnimation 20s linear infinite;
      }
      .signal-reverse {
        stroke-dasharray: 6 8;
        animation: dashReverse 25s linear infinite;
      }
      .ring-expand {
        transform-origin: center;
        animation: ringPulse 4s ease-out infinite;
      }
      .pill-float {
        animation: floatAnimation 5s ease-in-out infinite alternate;
      }
      .wave-bar {
        animation: waveHeight 1.8s ease-in-out infinite alternate;
      }
      @keyframes dashAnimation {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulseAnimation {
        0% { transform: scale(0.9) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.1) translate(15px, -10px); opacity: 0.55; }
        100% { transform: scale(0.95) translate(-10px, 15px); opacity: 0.35; }
      }
      @keyframes ringPulse {
        0% { r: 12px; opacity: 0.8; }
        100% { r: 42px; opacity: 0; }
      }
      @keyframes floatAnimation {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes waveHeight {
        0% { transform: scaleY(0.4); }
        50% { transform: scaleY(1.1); }
        100% { transform: scaleY(0.6); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Ambience (Behind Text) -->
  <g opacity="0.7">
    <circle class="orb-pulse" cx="220" cy="180" r="160" fill="#38bdf8" filter="url(#softGlow)" />
    <circle class="orb-pulse" cx="980" cy="190" r="170" fill="#818cf8" filter="url(#softGlow)" style="animation-delay: -3s;" />
    <circle class="orb-pulse" cx="600" cy="200" r="140" fill="#c084fc" filter="url(#softGlow)" style="animation-delay: -1.5s;" />
  </g>

  <!-- Telephony & SIP Dynamic Network Flow Lines (Background Layers) -->
  <g opacity="0.45">
    <path class="signal-line" d="M -50 120 Q 250 40, 500 130 T 1000 110 T 1250 140" fill="none" stroke="#38bdf8" stroke-width="2.2" />
    <path class="signal-reverse" d="M -50 280 Q 200 360, 550 270 T 950 320 T 1250 260" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="signal-line" d="M 100 390 C 300 290, 400 380, 700 310 C 950 250, 1100 330, 1250 310" fill="none" stroke="#c084fc" stroke-width="1.8" />
  </g>

  <!-- Dynamic Animated PBX Audio Waveforms Graphic -->
  <g transform="translate(1005, 140)" opacity="0.6">
    <rect class="wave-bar" x="0" y="0" width="4" height="60" rx="2" fill="#38bdf8" style="transform-origin: 2px 60px; animation-delay: 0.1s;" />
    <rect class="wave-bar" x="8" y="0" width="4" height="90" rx="2" fill="#818cf8" style="transform-origin: 10px 90px; animation-delay: 0.3s;" />
    <rect class="wave-bar" x="16" y="0" width="4" height="45" rx="2" fill="#38bdf8" style="transform-origin: 18px 45px; animation-delay: 0.5s;" />
    <rect class="wave-bar" x="24" y="0" width="4" height="110" rx="2" fill="#c084fc" style="transform-origin: 26px 110px; animation-delay: 0.2s;" />
    <rect class="wave-bar" x="32" y="0" width="4" height="70" rx="2" fill="#818cf8" style="transform-origin: 34px 70px; animation-delay: 0.7s;" />
    <rect class="wave-bar" x="40" y="0" width="4" height="120" rx="2" fill="#38bdf8" style="transform-origin: 42px 120px; animation-delay: 0.4s;" />
    <rect class="wave-bar" x="48" y="0" width="4" height="85" rx="2" fill="#c084fc" style="transform-origin: 50px 85px; animation-delay: 0.6s;" />
    <rect class="wave-bar" x="56" y="0" width="4" height="50" rx="2" fill="#818cf8" style="transform-origin: 58px 50px; animation-delay: 0.2s;" />
    <rect class="wave-bar" x="64" y="0" width="4" height="95" rx="2" fill="#38bdf8" style="transform-origin: 66px 95px; animation-delay: 0.8s;" />
    <rect class="wave-bar" x="72" y="0" width="4" height="30" rx="2" fill="#c084fc" style="transform-origin: 74px 30px; animation-delay: 0.3s;" />
  </g>

  <!-- Left Dynamic SIP Node Graphic -->
  <g transform="translate(100, 200)">
    <circle class="ring-expand" cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="url(#glowFilter)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Content Foreground Box (Ensures crisp readability) -->
  <rect x="140" y="55" width="920" height="290" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1.5" />

  <!-- Foreground Title and Headings -->
  <g text-anchor="middle">
    <!-- Top Category Tag -->
    <g transform="translate(600, 98)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">
        COMMUNICATIONS ARCHITECTURE
      </text>
    </g>

    <!-- Main Title with Gradient -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome Cloud Telephony &amp; PBX
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Directory of Cloud PBX, VoIP, UCaaS &amp; Open-Source Telephony Systems
    </text>

    <!-- Interactive Ecosystem Feature Pills -->
    <g transform="translate(600, 265)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">☎️ Cloud PBX</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-160, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🌐 SIP Servers</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">⚡ VoIP &amp; UCaaS</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(160, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🎙️ WebRTC &amp; RTP</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(320, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🤖 AI Telephony</text>
      </g>
    </g>

    <!-- Sub-tagline -->
    <text x="600" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Compare Enterprise SaaS Pricing &amp; Self-Hosted Open-Source Infrastructure
    </text>
  </g>
</svg>
